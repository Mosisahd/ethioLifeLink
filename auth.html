<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EthioLifeLink - Login / Create Account</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<link rel="icon" type="image/jpeg" href="images/site-icon.jpg">
<style>
.auth-page{min-height:calc(100vh - 90px);padding:42px 18px 70px;background:linear-gradient(135deg,#eef7ff 0%,#f8fbff 45%,#eefaf5 100%)}
.auth-wrap{max-width:520px;margin:0 auto}.auth-brand{text-align:center;margin-bottom:20px}.auth-brand img{width:82px;height:82px;object-fit:cover;border-radius:22px;box-shadow:0 12px 30px rgba(0,79,145,.18);background:#fff;padding:4px}.auth-brand h1{margin:12px 0 4px;color:#123b6d;font-size:28px}.auth-brand p{margin:0;color:#63758a}
.auth-card{background:rgba(255,255,255,.96);padding:30px;border-radius:22px;box-shadow:0 18px 55px rgba(20,64,105,.13);border:1px solid rgba(255,255,255,.9)}
.auth-tabs{display:flex;gap:8px;margin-bottom:22px;padding:5px;background:#eef4fa;border-radius:13px}.auth-tabs button{flex:1;border:0;border-radius:10px;background:transparent;padding:12px;font-weight:800;color:#526579;cursor:pointer}.auth-tabs button.active{background:#0868cf;color:#fff;box-shadow:0 6px 15px rgba(8,104,207,.2)}
.auth-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.auth-field.full{grid-column:1/-1}.auth-card label{display:block;font-size:14px;font-weight:700;color:#30475f;margin:3px 0 7px}.auth-card input,.auth-card select{width:100%;box-sizing:border-box;padding:13px 14px;margin:0 0 16px;border:1px solid #d5e0ea;border-radius:11px;background:#fff;font:inherit;outline:none}.auth-card input:focus,.auth-card select:focus{border-color:#1680e5;box-shadow:0 0 0 3px rgba(22,128,229,.1)}
.photo-picker{border:1.5px dashed #b7cde1;border-radius:15px;padding:16px;margin:2px 0 16px;background:#f8fbfe}.photo-row{display:flex;align-items:center;gap:14px}.photo-preview{width:66px;height:66px;border-radius:50%;object-fit:cover;background:#eaf2f9;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.1);display:none}.photo-placeholder{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaf2f9;color:#54708b;font-size:28px}.photo-copy strong{display:block;color:#24425f;margin-bottom:3px}.photo-copy small{color:#718397;line-height:1.4}.photo-picker input{border:0;padding:0;margin:8px 0 0;background:transparent}
.primary-auth-btn{width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;margin-top:4px;background:linear-gradient(135deg,#0868cf,#1597dd);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(8,104,207,.2)}.primary-auth-btn:hover{transform:translateY(-1px)}.primary-auth-btn:disabled{opacity:.65;cursor:wait}.msg{margin-top:16px;text-align:center;line-height:1.5;min-height:24px}.small{text-align:center;color:#6a7d90;font-size:14px;line-height:1.55}.account-box{text-align:center}.account-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;border:4px solid #e7f1fa}.account-name{font-size:22px;font-weight:800;color:#173d63;margin:0}.account-email{color:#6b7d90;margin:5px 0 20px}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary-btn{padding:12px;border:1px solid #cbd9e6;border-radius:11px;background:#fff;color:#245174;font-weight:700;cursor:pointer;text-decoration:none}.logout-btn{padding:12px;border:0;border-radius:11px;background:#eaf1f7;color:#24445e;font-weight:700;cursor:pointer}
@media(max-width:620px){.auth-page{padding-top:25px}.auth-card{padding:22px 18px}.auth-form-grid{grid-template-columns:1fr}.auth-field.full{grid-column:auto}.account-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="navbar">
  <div class="logo logo-with-icon">
    <a href="index.html" class="logo-icon-link" aria-label="EthioLifeLink home"><img src="images/site-icon.jpg" alt="EthioLifeLink logo"></a>
    <div><h2>EthioLifeLink</h2><span>Job Vacancy and Home for Rent</span></div>
  </div>
  <nav>
    <a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="homes.html">Homes</a><a href="add-listing.html">Add Listing</a>
  </nav>
</header>

<main class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand"><img src="images/site-icon.jpg" alt="EthioLifeLink logo"><h1>Your EthioLifeLink Account</h1><p>Find jobs, discover homes and manage your listings.</p></div>
    <div class="auth-card">
      <div class="auth-tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create Account</button></div>
      <form id="authForm">
        <div id="signupFields" style="display:none;">
          <div class="auth-form-grid">
            <div class="auth-field full"><label for="fullName">Full name</label><input id="fullName" type="text" autocomplete="name" placeholder="Enter your full name"></div>
            <div class="auth-field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" placeholder="09XXXXXXXX"></div>
            <div class="auth-field"><label for="gender">Gender</label><select id="gender"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
            <div class="auth-field full"><div class="photo-picker"><label for="profilePhoto">Profile picture <span style="font-weight:500;color:#8090a0;">(optional)</span></label><div class="photo-row"><div class="photo-placeholder" id="photoPlaceholder">👤</div><img id="photoPreview" class="photo-preview" alt="Selected profile picture preview"><div class="photo-copy"><strong>Add a profile picture if you want</strong><small>You can create your account without a picture. JPG, PNG or WebP, up to 5 MB.</small></div></div><input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp"></div></div>
          </div>
        </div>
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@gmail.com" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Create a password" required minlength="6">
        <button id="submitBtn" class="primary-auth-btn" type="submit">🔐 Login</button>
      </form>
      <p id="message" class="msg"></p>
      <div id="accountBox" class="account-box" style="display:none;">
        <img id="accountAvatar" class="account-avatar" src="images/site-icon.jpg" alt="Profile picture">
        <p id="accountName" class="account-name"></p><p id="accountEmail" class="account-email"></p>
        <div class="account-actions"><button type="button" id="logoutBtn" class="logout-btn">Log out</button><a class="secondary-btn" href="index.html">Go to Home</a></div>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
  const client=window.supabaseClient; let mode='login'; let currentSession=null;
  const params=new URLSearchParams(location.search); const returnTo=params.get('return')||'index.html';
  const email=document.getElementById('email'), password=document.getElementById('password'), msg=document.getElementById('message');
  const fullName=document.getElementById('fullName'), phone=document.getElementById('phone'), gender=document.getElementById('gender'), profilePhoto=document.getElementById('profilePhoto'), photoPreview=document.getElementById('photoPreview'), photoPlaceholder=document.getElementById('photoPlaceholder');
  const form=document.getElementById('authForm'), btn=document.getElementById('submitBtn'), loginTab=document.getElementById('loginTab'), signupTab=document.getElementById('signupTab'), signupFields=document.getElementById('signupFields');
  function safeReturn(){ const allowed=['index.html','jobs.html','homes.html','add-listing.html','details.html']; return allowed.includes(returnTo) ? returnTo : 'index.html'; }
  function setMode(m){mode=m; loginTab.classList.toggle('active',m==='login'); signupTab.classList.toggle('active',m==='signup'); signupFields.style.display=m==='signup'?'block':'none'; btn.textContent=m==='login'?'🔐 Login':'✅ Create Account'; msg.textContent=''; password.autocomplete=m==='login'?'current-password':'new-password';}
  loginTab.onclick=()=>setMode('login'); signupTab.onclick=()=>setMode('signup');
  profilePhoto.addEventListener('change',()=>{const file=profilePhoto.files&&profilePhoto.files[0]; if(!file){photoPreview.style.display='none';photoPlaceholder.style.display='flex';return;} if(file.size>5*1024*1024){msg.textContent='❌ Profile picture must be 5 MB or smaller.';profilePhoto.value='';return;} const url=URL.createObjectURL(file);photoPreview.src=url;photoPreview.style.display='block';photoPlaceholder.style.display='none';});
  async function refreshIfNeeded(){const r=await client.auth.getSession();if(r.error)throw r.error;let s=r.data.session;if(s&&s.expires_at&&s.expires_at*1000-Date.now()<60000){const rr=await client.auth.refreshSession();if(rr.error)throw rr.error;s=rr.data.session;}return s;}
  async function upsertProfile(user, photoFile){
    if(!user)return;
    const meta=user.user_metadata||{}; let photoUrl=meta.profile_picture_url||null;
    if(photoFile){
      if(photoFile.size>5*1024*1024) throw new Error('Profile picture must be 5 MB or smaller.');
      const ext=(photoFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const path=user.id+'/profile.'+ext;
      const upload=await client.storage.from('profile-pictures').upload(path,photoFile,{upsert:true,contentType:photoFile.type||'image/jpeg'});
      if(upload.error)throw upload.error;
      photoUrl=client.storage.from('profile-pictures').getPublicUrl(path).data.publicUrl;
      await client.auth.updateUser({data:{profile_picture_url:photoUrl}});
    }
    const profile={id:user.id,full_name:meta.full_name||null,phone:meta.phone||null,gender:meta.gender||null,profile_picture_url:photoUrl};
    const r=await client.from('profiles').upsert(profile,{onConflict:'id'}); if(r.error) console.warn('Profile table sync:',r.error.message);
  }
  async function showAccount(session){
    currentSession=session; const user=session.user; const meta=user.user_metadata||{};
    document.getElementById('authForm').style.display='none';document.querySelector('.auth-tabs').style.display='none';document.getElementById('accountBox').style.display='block';
    document.getElementById('accountName').textContent=meta.full_name||'EthioLifeLink member'; document.getElementById('accountEmail').textContent=user.email||'';
    let avatar=meta.profile_picture_url||'images/site-icon.jpg';
    const p=await client.from('profiles').select('profile_picture_url,full_name,phone,gender').eq('id',user.id).maybeSingle();
    if(!p.error&&p.data){avatar=p.data.profile_picture_url||avatar;document.getElementById('accountName').textContent=p.data.full_name||meta.full_name||'EthioLifeLink member';}
    document.getElementById('accountAvatar').src=avatar;
    document.getElementById('logoutBtn').onclick=async()=>{await client.auth.signOut();location.reload();};
  }
  async function init(){
    if(!client){msg.textContent='❌ Supabase is not connected.';return;}
    try{const s=await refreshIfNeeded();if(s){await upsertProfile(s.user,null);await showAccount(s);}}catch(e){console.warn(e);}
  }
  form.addEventListener('submit',async e=>{e.preventDefault();if(!client){msg.textContent='❌ Supabase is not connected.';return;}msg.textContent='Please wait...';btn.disabled=true;
    try{
      const em=email.value.trim().toLowerCase(), pw=password.value; let r;
      if(mode==='login'){
        r=await client.auth.signInWithPassword({email:em,password:pw});
      } else {
        if(!fullName.value.trim())throw new Error('Please enter your full name.');
        if(!phone.value.trim())throw new Error('Please enter your phone number.');
        if(!gender.value)throw new Error('Please select your gender.');
        r=await client.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname.replace('auth.html','index.html'),data:{full_name:fullName.value.trim(),phone:phone.value.trim(),gender:gender.value}}});
      }
      if(r.error)throw r.error;
      if(mode==='signup'&&!r.data.session){msg.textContent='✅ Account created. Check your email to confirm your account, then log in. Your name, phone and gender were saved with the account. You can add your optional profile picture after logging in.';return;}
      if(mode==='signup'&&r.data.session){await upsertProfile(r.data.user,profilePhoto.files&&profilePhoto.files[0]);msg.textContent='✅ Account created successfully. Redirecting...';location.href=safeReturn();return;}
      msg.textContent='✅ Login successful. Redirecting...';location.href=safeReturn();
    }catch(err){console.error(err);msg.textContent='❌ '+(err.message||'Authentication failed.');}finally{btn.disabled=false;}
  });
  init();
})();
</script>
</body>
</html>

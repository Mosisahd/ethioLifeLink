<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EthioLifeLink - My Listings</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><link rel="icon" type="image/jpeg" href="images/site-icon.jpg">
<style>
.my-wrap{max-width:1050px;margin:35px auto;padding:20px}.my-card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}.my-card h3{margin-top:0}.status{display:inline-block;padding:5px 10px;border-radius:20px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.changes_requested{background:#fff7ed;color:#9a3412}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.feedback{margin-top:14px;padding:14px;background:#fff7ed;border-left:4px solid #f59e0b;border-radius:7px}.edit-btn{display:inline-block;margin-top:15px;background:#2563eb;color:#fff;padding:10px 15px;border-radius:7px;text-decoration:none;font-weight:700}.empty{padding:25px;background:#f3f4f6;border-radius:10px;text-align:center}.dates{background:#f0f7ff;padding:10px;border-radius:7px;margin:10px 0}
.rental-status{display:inline-block;padding:5px 10px;border-radius:20px;font-weight:700}.rental-status.available{background:#dcfce7;color:#166534}.rental-status.rented{background:#fee2e2;color:#991b1b}.status-btn{margin-top:10px;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer;background:#374151;color:#fff}.status-btn:hover{opacity:.9}</style></head><body>
<header><div class="logo logo-with-icon"><a href="index.html" class="logo-icon-link"><img src="images/site-icon.jpg" alt="EthioLifeLink logo"></a><div><h1>EthioLifeLink</h1><p>Job Vacancy and Home for Rent</p></div></div><nav><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="homes.html">Homes</a><a href="add-listing.html">Add Listing</a><a href="auth.html">Account</a></nav></header>
<main><div class="my-wrap"><h2>My Listings</h2><p>See the status of your submitted jobs and homes, including any admin feedback.</p><div id="container"><div class="empty">Loading your listings...</div></div></div></main>
<script>
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function statusLabel(s){return s==='changes_requested'?'Changes Requested':s.charAt(0).toUpperCase()+s.slice(1);}
async function toggleRentalStatus(id, nextStatus){
  const label=nextStatus==='rented'?'rented':'available';
  const question=label==='rented'?'Mark this home as Rented?':'Mark this home as Available again?';
  if(!confirm(question)) return;
  try{
    const r=await supabaseClient.from('listings').update({rental_status:label}).eq('id',id);
    if(r.error) throw r.error;
    alert(label==='rented'?'✅ Home marked as Rented.':'✅ Home marked as Available.');
    init();
  }catch(e){ alert('❌ Could not update rental status.\n\n'+e.message); }
}
async function init(){const c=document.getElementById('container');try{let r=await supabaseClient.auth.getSession();let session=r.data&&r.data.session;if(!session){location.href='auth.html?return=my-listings.html';return;}const q=await supabaseClient.from('listings').select('*').eq('submitted_by',session.user.id).order('id',{ascending:false});if(q.error)throw q.error;if(!q.data.length){c.innerHTML='<div class="empty">You have not submitted any listings yet.<br><br><a href="add-listing.html">Add a listing</a></div>';return;}c.innerHTML=q.data.map(x=>{const isJob=x.listing_type==='job';const canEdit=['changes_requested','rejected','pending'].includes(x.status);const isHomeApproved=isJob===false && x.status==='approved';return `<div class="my-card"><h3>${isJob?'💼':'🏠'} ${esc(x.title||'Untitled')}</h3><p><strong>Type:</strong> ${isJob?'Job Vacancy':'Home for Rent'}</p><p><strong>Location:</strong> ${esc(x.area||'')} ${x.area?', ':''}${esc(x.city||'')}</p><p><strong>Status:</strong> <span class="status ${esc(x.status)}">${esc(statusLabel(x.status))}</span></p>${isJob?`<div class="dates"><strong>Application Start:</strong> ${esc(x.open_at||'Immediately')}<br><strong>Vacancy Expires:</strong> ${esc(x.expire_at||'Not specified')}</div>`:`<p><strong>Rental Status:</strong> <span class="rental-status ${x.rental_status==='rented'?'rented':'available'}">${x.rental_status==='rented'?'🔴 Rented':'🟢 Available'}</span></p>${isHomeApproved?`<button type="button" class="status-btn" onclick="toggleRentalStatus(${Number(x.id)}, '${x.rental_status==='rented'?'available':'rented'}')">${x.rental_status==='rented'?'🟢 Mark Available':'🔴 Mark Rented'}</button>`:''}` }${x.admin_feedback?`<div class="feedback"><strong>Admin feedback:</strong><br>${esc(x.admin_feedback)}</div>`:''}${canEdit?`<a class="edit-btn" href="add-listing.html?edit=${encodeURIComponent(x.id)}">✏️ Edit and Send for Review</a>`:''}</div>`}).join('');}catch(e){console.error(e);c.innerHTML='<div class="empty">❌ Could not load your listings.<br><br>'+esc(e.message)+'</div>';}}
init();
</script></body></html>
